name: Docker image

# Builds the runtime image natively on amd64 and arm64 runners (running the full test suite on
# each architecture first), publishes a multi-arch image to GitHub Container Registry and, for
# version tags (v1.2.3), creates the GitHub Release.
#
#   main     -> ghcr.io/<owner>/prelo:latest, :sha-<commit>
#   v1.2.3   -> ghcr.io/<owner>/prelo:1.2.3, :1.2, :1, :sha-<commit>

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DESCRIPTION: >-
    Prelo: converta Markdown em PDF e Word mantendo tabelas, código, diagramas Mermaid e
    fórmulas. Página web + API REST com Swagger.

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Prelo
            org.opencontainers.image.description=${{ env.DESCRIPTION }}

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          platforms: ${{ matrix.platform }}
          tags: prelo:test
          load: true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Run test suite
        run: docker run --rm --init --shm-size=512m prelo:test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          provenance: mode=max
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - name: Prepare
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.title=Prelo" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect the published image
        id: inspect
        env:
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG"
          digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

      - name: Smoke test the published image
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          docker run -d --name prelo -p 127.0.0.1:8000:8000 --shm-size=512m "$IMAGE@$DIGEST"
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/v1/health && break
            sleep 2
          done
          echo
          curl -fsS -o exemplo.pdf -F "file=@examples/exemplo-completo.md" \
            http://localhost:8000/api/v1/convert/pdf
          test "$(head -c 5 exemplo.pdf)" = "%PDF-"
          curl -fsS -o exemplo.docx -F "file=@examples/exemplo-completo.md" \
            http://localhost:8000/api/v1/convert/docx
          test "$(head -c 2 exemplo.docx)" = "PK"
          docker rm -f prelo

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          {
            echo "### Imagem publicada"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:${{ steps.meta.outputs.version }}"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\` · plataformas: \`linux/amd64\`, \`linux/arm64\`"
            echo
            echo "Tags:"
            echo
            while IFS= read -r tag; do [ -n "$tag" ] && echo "- \`$tag\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          cat > notes.md <<EOF
          ## Imagem Docker

          Multi-arquitetura (\`linux/amd64\` e \`linux/arm64\`, inclusive Apple Silicon):

          \`\`\`bash
          docker run -d --name prelo -p 127.0.0.1:8000:8000 --shm-size=512m ${image}:${VERSION}
          \`\`\`

          Depois abra http://localhost:8000 (página web) ou http://localhost:8000/docs (Swagger).

          Digest: \`${DIGEST}\`

          Verifique a procedência da imagem com:

          \`\`\`bash
          gh attestation verify oci://${image}:${VERSION} -R ${GITHUB_REPOSITORY}
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Prelo ${VERSION}" --notes-file notes.md --generate-notes
